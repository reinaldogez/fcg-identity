name: SonarCloud

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # obrigatório: Sonar usa git blame para identificar código novo

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore

      - name: Instalar dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Instalar dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Iniciar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"reinaldogez_fiap-cloud-games-mvp" \
            /o:"reinaldogez" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"

      - name: Build
        run: dotnet build --no-restore --no-incremental --configuration Release

      - name: Testes com cobertura
        run: |
          dotnet-coverage collect \
            "dotnet test tests/FCG.Tests.Unit/ --no-build --configuration Release" \
            -f opencover \
            -o coverage.opencover.xml

      - name: Finalizar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
