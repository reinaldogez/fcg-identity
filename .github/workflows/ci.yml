name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # restore do Fcg.Contracts (feed NuGet do GitHub Packages exige token)

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          source-url: https://nuget.pkg.github.com/reinaldogez/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testes Unitários
        run: |
          dotnet test tests/Fcg.Identity.Tests.Unit/ \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Unit \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload cobertura unitários
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: TestResults/Unit/**/coverage.opencover.xml

  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # restore do Fcg.Contracts (feed NuGet do GitHub Packages exige token)

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          source-url: https://nuget.pkg.github.com/reinaldogez/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testes de Integração
        run: |
          dotnet test tests/Fcg.Identity.Tests.Integration/ \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Integration \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload cobertura integração
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: TestResults/Integration/**/coverage.opencover.xml

  bdd-tests:
    name: Testes BDD (Reqnroll)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # restore do Fcg.Contracts (feed NuGet do GitHub Packages exige token)

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          source-url: https://nuget.pkg.github.com/reinaldogez/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testes BDD
        run: |
          dotnet test tests/Fcg.Identity.Tests.Bdd/ \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Bdd \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload cobertura BDD
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bdd
          path: TestResults/Bdd/**/coverage.opencover.xml

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, bdd-tests]
    permissions:
      contents: read
      packages: read # restore do Fcg.Contracts (feed NuGet do GitHub Packages exige token)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # obrigatório: Sonar usa git blame para identificar código novo

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          source-url: https://nuget.pkg.github.com/reinaldogez/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Download cobertura unitários
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: TestResults/Unit

      - name: Download cobertura integração
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: TestResults/Integration

      - name: Download cobertura BDD
        uses: actions/download-artifact@v4
        with:
          name: coverage-bdd
          path: TestResults/Bdd

      - name: Instalar dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"reinaldogez_fcg-identity" \
            /o:"reinaldogez" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/DTOs/**,**/Options/**,**/OpenApi/**,**/Logging/**,**/Program.cs,**/*Requirement.cs" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"

      - name: Build
        run: dotnet build --no-restore --no-incremental --configuration Release

      - name: Finalizar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  publish:
    name: Publicar imagem (GHCR)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, bdd-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write # push da imagem ao GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (owner em minúsculo)
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fcg-identity" >> "$GITHUB_OUTPUT"

      # O Dockerfile faz restore interno do Fcg.Contracts e exige o token via BuildKit secret
      # (id=gh_token); o build-push-action usa Buildx, então o secret satisfaz o --mount do RUN.
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:latest
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
